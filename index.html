<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Hindi Typing Master & Tutor (Zero Scroll Screen)</title>
  <meta name="description" content="100% Free Single-Screen Hindi Typing Tutor. Zero scroll PC layout and landscape side-by-side mode.">

  <!-- Privacy Analytics -->
  <script data-goatcounter="https://quicktools.goatcounter.com/count"
          data-goatcounter-settings='{"allow_local": true}'
          async src="//gc.zgo.at/count.js"></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a' stroke='%23f59e0b' stroke-width='1.5'/%3E%3Ctext x='7' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='%23f59e0b'%3Eक%3C/text%3E%3Crect x='19' y='14' width='7' height='2' fill='%2338bdf8'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #090d16;
      --card: #131c2e;
      --card-inner: #0b1120;
      --border: #1e293b;
      --primary: #f59e0b;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    }

    /* ZERO-SCROLL 100VH LOCK FOR PC AND MOBILE */
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* COMPACT GLOBAL HEADER */
    #quicktools-global-bar {
      background: #060911;
      border-bottom: 1px solid var(--border);
      padding: 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      height: 30px;
      flex-shrink: 0;
    }
    #quicktools-global-bar a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }
    #quicktools-global-bar a:hover { color: #fff; }

    /* SINGLE VIEWPORT APP FRAME */
    .app-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 14px;
      gap: 8px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      min-height: 0;
    }

    /* PC COMPACT TOOLBAR & SCOREBOARD */
    .dashboard-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .selectors-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      outline: none;
      height: 28px;
    }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 28px;
    }
    .stat-val { font-size: 0.88rem; font-weight: 900; }

    /* WORKSPACE: PASSAGE & INPUT CONTAINER */
    .workspace-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      min-height: 0;
    }

    /* FULL PARAGRAPH TEXT BOX (PC & PORTRAIT) */
    .passage-card {
      flex: 1;
      background: var(--card-inner);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1.2rem;
      line-height: 2;
      overflow-y: auto;
      user-select: none;
      letter-spacing: 0.02em;
    }
    .passage-card::-webkit-scrollbar { width: 5px; }
    .passage-card::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .char-current {
      background: var(--primary);
      color: #0b1120;
      border-radius: 3px;
      padding: 1px 4px;
      font-weight: 800;
    }
    .char-correct { color: var(--accent); }
    .char-wrong { background: rgba(239, 68, 68, 0.4); color: var(--danger); border-radius: 2px; }

    /* DIRECT INPUT BOX */
    .input-card {
      flex-shrink: 0;
      height: 52px;
      background: var(--card);
      border: 2px solid rgba(245, 158, 11, 0.45);
      border-radius: 8px;
      overflow: hidden;
    }
    .input-card:focus-within { border-color: var(--primary); }

    .typing-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.15rem;
      padding: 0 14px;
      outline: none;
    }

    /* FULL ON-SCREEN VISUAL KEYBOARD (PC & PORTRAIT) */
    .keyboard-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      user-select: none;
    }
    .kb-row {
      display: flex;
      gap: 4px;
      justify-content: center;
    }
    .kb-key {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 2px;
      flex: 1;
      max-width: 58px;
      height: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .key-eng { font-size: 0.6rem; color: var(--muted); font-weight: 700; line-height: 1; }
    .key-hin { font-size: 0.95rem; color: #fff; font-weight: 800; line-height: 1.1; margin-top: 1px; }

    /* ========================================================
       MOBILE LANDSCAPE RULES: AUTO SIDE-BY-SIDE + NO KEYBOARD
       ======================================================== */
    @media screen and (orientation: landscape) and (max-height: 560px) {
      #quicktools-global-bar { display: none !important; }
      .keyboard-panel, #keyboardGuide { display: none !important; }

      .app-screen {
        padding: 4px 8px !important;
        gap: 6px !important;
      }
      .dashboard-strip {
        padding: 3px 8px !important;
      }

      /* SIDE-BY-SIDE EQUAL COLUMNS */
      .workspace-area {
        flex-direction: row !important;
        flex: 1 !important;
        gap: 8px !important;
      }
      .passage-card {
        flex: 1 !important;
        height: 100% !important;
        font-size: 1.05rem !important;
        line-height: 1.6 !important;
        padding: 8px 12px !important;
      }
      .input-card {
        flex: 1 !important;
        height: 100% !important;
      }
      .typing-input {
        height: 100% !important;
        font-size: 1.05rem !important;
        padding: 10px 12px !important;
      }
    }

    /* COMPLETION MODAL POPUP */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 1.4rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-meta-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin: 12px 0;
      text-align: left;
    }
    .modal-meta-box div { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .modal-meta-box div:last-child { margin-bottom: 0; }
    .btn-modal-primary {
      width: 100%;
      background: var(--primary);
      color: #0b1120;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- GLOBAL NETWORK HEADER -->
  <div id="quicktools-global-bar">
    <div style="display:flex; align-items:center; gap:6px;">
      <a href="https://unknownuniversem-blip.github.io/" style="color:#f8fafc; font-weight:800;">
        <span style="background:#38bdf8; color:#0b1120; font-size:9px; padding:1px 4px; border-radius:3px;">HUB</span> QuickTools
      </a>
    </div>
    <div style="display:flex; align-items:center; gap:10px; overflow-x:auto;">
      <a href="https://unknownuniversem-blip.github.io/hindi-typing-tutor/" style="color:#f59e0b;">⌨️ हिंदी टाइपिंग</a>
      <span>|</span>
      <a href="https://unknownuniversem-blip.github.io/signature-maker-studio/">✍️️ Signature Studio</a>
      <span>|</span>
      <a href="https://unknownuniversem-blip.github.io/krutidev-unicode-converter/">🔤 फॉन्ट कनवर्टर</a>
      <span>|</span>
      <a href="https://unknownuniversem-blip.github.io/exam-resizer/">📷 Photo Resizer</a>
    </div>
  </div>

  <div class="app-screen">
    <!-- TOP TOOLBAR & SCOREBOARD (ALL IN 1 COMPACT BAR) -->
    <div class="dashboard-strip">
      <div class="brand-title">
        <span>⌨️ HindiTyping<span style="color:var(--primary);">Master</span></span>
      </div>

      <div class="selectors-row">
        <select id="selLayout" onchange="changeLayout()">
          <option value="mangal" selected>मंगल (Mangal)</option>
          <option value="kruti">कृतिदेव (Kruti)</option>
        </select>
        <select id="selDuration" onchange="resetTest()">
          <option value="60">1 Min</option>
          <option value="180">3 Min</option>
          <option value="300" selected>05:00</option>
          <option value="600">10 Min</option>
        </select>
        <select id="selPassage" onchange="loadPassage()">
          <option value="basic" selected>सरल (Basic)</option>
          <option value="court">कोर्ट वाद (Legal)</option>
          <option value="editorial">संपादकीय (Hard)</option>
        </select>
      </div>

      <div class="stats-row">
        <div class="stat-pill" style="border-color:var(--primary);">
          <span>⏱</span><span class="stat-val" id="valTime" style="color:var(--primary);">05:00</span>
        </div>
        <div class="stat-pill" style="border-color:var(--accent);">
          <span>⚡</span><span class="stat-val" id="valWpm" style="color:var(--accent);">0</span><span>WPM</span>
        </div>
        <div class="stat-pill" style="border-color:#38bdf8;">
          <span>🎯</span><span class="stat-val" id="valAcc" style="color:#38bdf8;">100%</span>
        </div>
        <div class="stat-pill" style="border-color:var(--danger);">
          <span>✕</span><span class="stat-val" id="valErrors" style="color:var(--danger);">0</span>
        </div>
      </div>
    </div>

    <!-- WORKSPACE: AUTO SIDE-BY-SIDE IN LANDSCAPE, STACKED ON PC -->
    <div class="workspace-area">
      <!-- FULL PARAGRAPH TEXT -->
      <div class="passage-card" id="passageDisplay">गद्यांश लोड हो रहा है...</div>

      <!-- DIRECT INPUT FIELD -->
      <div class="input-card">
        <input type="text" class="typing-input" id="typingInput"
               placeholder="यहाँ टाइप करें (पहला अक्षर टाइप करते ही समय चालू होगा)..."
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               autofocus oninput="handleTyping(event)">
      </div>
    </div>

    <!-- ON-SCREEN KEYBOARD (VISIBLE ON PC, AUTO-HIDDEN IN MOBILE LANDSCAPE) -->
    <div class="keyboard-panel" id="keyboardGuide"></div>
  </div>

  <!-- COMPLETION MODAL POPUP -->
  <div class="modal-overlay" id="completionModal">
    <div class="modal-card">
      <div style="font-size:2rem; margin-bottom:4px;">🏆</div>
      <div style="font-size:1.15rem; font-weight:800; color:#fff;" id="modalTitle">टाइपिंग टेस्ट पूर्ण!</div>

      <div class="modal-meta-box">
        <div><span>शुद्ध स्पीड (Net WPM):</span> <strong id="modalNetWpm" style="color:var(--accent);">0 WPM</strong></div>
        <div><span>सटीकता (Accuracy):</span> <strong id="modalAccuracy" style="color:#38bdf8;">100%</strong></div>
        <div><span>कुल गलतियां (Errors):</span> <strong id="modalErrors" style="color:var(--danger);">0</strong></div>
        <div><span>परीक्षा अर्हता:</span> <strong id="modalQualify" style="color:var(--primary);">जांच जारी...</strong></div>
      </div>

      <button type="button" class="btn-modal-primary" onclick="resetTest()">🔄 पुनः टेस्ट दें (Restart)</button>
    </div>
  </div>

  <script>
    const passages = {
      basic: "भारत में बहुत से खेल खेले जाते हैं लेकिन क्रिकेट सबसे लोकप्रिय खेल है। क्रिकेट का आरंभ इंग्लैंड में हुआ था और आज यह दुनिया के सबसे बड़े खेलों में गिना जाता है। भारतीय क्रिकेट टीम ने विश्व पटल पर अपनी उत्कृष्ट प्रतिभा और अनुशासन से कई कीर्तिमान स्थापित किए हैं। खेल से शारीरिक स्फूर्ति और मानसिक एकाग्रता का विकास होता है। नियमित अभ्यास ही किसी भी खिलाड़ी को श्रेष्ठ बनाता है।",
      court: "न्यायालय जिला एवं सत्र न्यायाधीश द्वारा यह आदेश पारित किया जाता है कि प्रस्तुत वाद संख्या 108 में सभी आवश्यक प्रपत्र तथा साक्ष्य नियत तिथि से पूर्व कार्यालय में जमा कराए जाएं। किसी भी विलंब की स्थिति में पक्षकार स्वयं उत्तरदायी होंगे। साक्षी को अगली सुनवाई पर व्यक्तिगत रूप से उपस्थित रहने का निर्देश दिया जाता है।",
      editorial: "आधुनिक डिजिटल युग में सूचना प्रौद्योगिकी ने प्रशासनिक कार्यप्रणाली को अत्यधिक पारदर्शी और त्वरित बना दिया है। नागरिकों को बिना किसी अनावश्यक बाधा के सार्वजनिक सेवाओं की सहज उपलब्धता सुनिश्चित करना सुशासन का मूल आधार है। ई-गवर्नेंस के माध्यम से योजनाओं की निगरानी वास्तविक समय में संभव हो सकी है।"
    };

    const kbRows = [
      [
        { eng: 'Q', mangal: 'ौ', kruti: 'ु' }, { eng: 'W', mangal: 'ै', kruti: 'ू' }, { eng: 'E', mangal: 'ा', kruti: 'म' },
        { eng: 'R', mangal: 'ी', kruti: 'त' }, { eng: 'T', mangal: 'ू', kruti: 'ज' }, { eng: 'Y', mangal: 'ब', kruti: 'ल' },
        { eng: 'U', mangal: 'ह', kruti: 'न' }, { eng: 'I', mangal: 'ग', kruti: 'प' }, { eng: 'O', mangal: 'द', kruti: 'व' },
        { eng: 'P', mangal: 'ज', kruti: 'च' }
      ],
      [
        { eng: 'A', mangal: 'ो', kruti: 'ं' }, { eng: 'S', mangal: 'े', kruti: 'े' }, { eng: 'D', mangal: '्', kruti: 'क' },
        { eng: 'F', mangal: 'ि', kruti: 'ि' }, { eng: 'G', mangal: 'ु', kruti: 'ह' }, { eng: 'H', mangal: 'प', kruti: 'ी' },
        { eng: 'J', mangal: 'र', kruti: 'र' }, { eng: 'K', mangal: 'क', kruti: 'ा' }, { eng: 'L', mangal: 'त', kruti: 'स' }
      ],
      [
        { eng: 'Z', mangal: 'े', kruti: '्र' }, { eng: 'X', mangal: 'ं', kruti: 'ग' }, { eng: 'C', mangal: 'म', kruti: 'ब' },
        { eng: 'V', mangal: 'न', kruti: 'अ' }, { eng: 'B', mangal: 'व', kruti: 'इ' }, { eng: 'N', mangal: 'ल', kruti: 'द' },
        { eng: 'M', mangal: 'स', kruti: 'उ' }
      ]
    ];

    let currentPassage = "";
    let currentIndex = 0;
    let timerRunning = false;
    let timeRemaining = 300;
    let totalTime = 300;
    let timerInterval = null;
    let errorsCount = 0;
    let totalCharsTyped = 0;

    window.addEventListener('DOMContentLoaded', () => {
      renderKeyboard();
      loadPassage();
    });

    function renderKeyboard() {
      const kbContainer = document.getElementById('keyboardGuide');
      const layout = document.getElementById('selLayout').value;
      kbContainer.innerHTML = '';

      kbRows.forEach(row => {
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';
        row.forEach(k => {
          const keyEl = document.createElement('div');
          keyEl.className = 'kb-key';
          keyEl.innerHTML = `<span class="key-eng">${k.eng}</span><span class="key-hin">${layout === 'mangal' ? k.mangal : k.kruti}</span>`;
          rowEl.appendChild(keyEl);
        });
        kbContainer.appendChild(rowEl);
      });
    }

    function changeLayout() { renderKeyboard(); resetTest(); }

    function loadPassage() {
      const pKey = document.getElementById('selPassage').value;
      currentPassage = passages[pKey] || passages.basic;
      resetTest();
    }

    function renderPassage() {
      const display = document.getElementById('passageDisplay');
      let html = '';
      for (let i = 0; i < currentPassage.length; i++) {
        let ch = currentPassage[i];
        if (i === currentIndex) {
          html += `<span class="char-current" id="activeChar">${ch === ' ' ? '&nbsp;' : ch}</span>`;
        } else if (i < currentIndex) {
          html += `<span class="char-correct">${ch === ' ' ? ' ' : ch}</span>`;
        } else {
          html += `<span>${ch === ' ' ? ' ' : ch}</span>`;
        }
      }
      display.innerHTML = html;
      const activeEl = document.getElementById('activeChar');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function handleTyping(e) {
      if (!timerRunning) startTimer();
      const input = document.getElementById('typingInput');
      const val = input.value;
      if (!val) return;

      const typedChar = val[val.length - 1];
      const expectedChar = currentPassage[currentIndex];
      totalCharsTyped++;

      if (typedChar === expectedChar) {
        currentIndex++;
        input.value = '';
      } else {
        errorsCount++;
      }
      updateScores();
      renderPassage();

      if (currentIndex >= currentPassage.length) {
        finishTest();
      }
    }

    function startTimer() {
      timerRunning = true;
      totalTime = Number(document.getElementById('selDuration').value);
      timeRemaining = totalTime;

      timerInterval = setInterval(() => {
        timeRemaining--;
        const m = Math.floor(timeRemaining / 60);
        const s = timeRemaining % 60;
        document.getElementById('valTime').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeRemaining <= 0) {
          finishTest();
        }
      }, 1000);
    }

    function updateScores() {
      const timeSpentMin = Math.max((totalTime - timeRemaining) / 60, 0.05);
      const netWpm = Math.max(0, Math.round(((totalCharsTyped - errorsCount) / 5) / timeSpentMin));
      const accuracy = totalCharsTyped > 0 ? Math.max(0, Math.round(((totalCharsTyped - errorsCount) / totalCharsTyped) * 100)) : 100;
      document.getElementById('valWpm').innerText = netWpm;
      document.getElementById('valAcc').innerText = `${accuracy}%`;
      document.getElementById('valErrors').innerText = errorsCount;
    }

    function finishTest() {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('typingInput').disabled = true;

      const netWpm = Number(document.getElementById('valWpm').innerText);
      const acc = document.getElementById('valAcc').innerText;

      document.getElementById('modalNetWpm').innerText = `${netWpm} WPM`;
      document.getElementById('modalAccuracy').innerText = acc;
      document.getElementById('modalErrors').innerText = errorsCount;

      let qualifyText = "अर्ह (Qualified)";
      let qualifyColor = "#10b981";
      if (netWpm < 25) {
        qualifyText = "पुनः अभ्यास आवश्यक (<25 WPM)";
        qualifyColor = "#ef4444";
      } else if (netWpm >= 30) {
        qualifyText = "उत्कृष्ट! हाईकोर्ट/SSC अर्ह (30+ WPM)";
      }

      const qEl = document.getElementById('modalQualify');
      qEl.innerText = qualifyText;
      qEl.style.color = qualifyColor;

      document.getElementById('completionModal').classList.add('active');
    }

    function resetTest() {
      clearInterval(timerInterval);
      timerRunning = false;
      currentIndex = 0;
      errorsCount = 0;
      totalCharsTyped = 0;
      totalTime = Number(document.getElementById('selDuration').value);
      timeRemaining = totalTime;

      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      document.getElementById('valTime').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      document.getElementById('valWpm').innerText = '0';
      document.getElementById('valAcc').innerText = '100%';
      document.getElementById('valErrors').innerText = '0';

      const input = document.getElementById('typingInput');
      input.value = '';
      input.disabled = false;
      input.focus();
      renderPassage();
      document.getElementById('completionModal').classList.remove('active');
    }
  </script>
</body>
</html>

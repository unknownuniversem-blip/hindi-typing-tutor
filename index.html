<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Hindi Typing Master & Tutor</title>
  <meta name="description" content="100% Free Single-Screen Hindi Typing Tutor with side-by-side landscape mode.">

  <!-- Privacy Analytics -->
  <script data-goatcounter="https://quicktools.goatcounter.com/count"
          data-goatcounter-settings='{"allow_local": true}'
          async src="//gc.zgo.at/count.js"></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a' stroke='%23f59e0b' stroke-width='1.5'/%3E%3Ctext x='7' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='%23f59e0b'%3Eक%3C/text%3E%3Crect x='19' y='14' width='7' height='2' fill='%2338bdf8'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg-primary: #0a1120;
      --bg-card: #131d31;
      --bg-surface: #0f172a;
      --border: #223249;
      --primary: #f59e0b;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden !important;
      background-color: var(--bg-primary);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* GLOBAL NAV BAR */
    #quicktools-global-bar {
      background: #060911;
      border-bottom: 1px solid var(--border);
      padding: 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      height: 30px;
      flex-shrink: 0;
    }
    #quicktools-global-bar a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }
    #quicktools-global-bar a:hover { color: #fff; }

    /* MAIN APP SHELL */
    .app-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 6px 10px;
      gap: 6px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    /* HEADER CONTROLS */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #fff;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      outline: none;
      height: 26px;
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      height: 26px;
    }
    .toggle-switch {
      position: relative;
      width: 26px;
      height: 14px;
      background: #334155;
      border-radius: 9999px;
      transition: background 0.2s ease;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
    }
    .toggle-wrapper.active .toggle-switch { background: var(--primary); }
    .toggle-wrapper.active .toggle-switch::after { transform: translateX(12px); }

    .stat-badge {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      height: 26px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* WORKSPACE */
    .workspace-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      min-height: 0;
    }

    .passage-card, .input-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .passage-card {
      flex: 1;
      font-size: 1.15rem;
      line-height: 1.8;
      padding: 10px 12px;
      user-select: none;
      letter-spacing: 0.02em;
    }

    .input-card {
      flex-shrink: 0;
      height: 56px;
      padding: 0;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .typing-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.15rem;
      padding: 8px 12px;
      outline: none;
      resize: none;
    }

    .char-current {
      background: var(--primary);
      color: #0b1120;
      border-radius: 3px;
      padding: 0 3px;
      font-weight: 800;
    }
    .char-correct { color: var(--accent); }
    .char-wrong { background: rgba(239, 68, 68, 0.4); color: var(--danger); border-radius: 2px; }

    /* ON-SCREEN KEYBOARD (PORTRAIT ONLY) */
    .keyboard-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      user-select: none;
    }
    .kb-row { display: flex; gap: 4px; justify-content: center; }
    .kb-key {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 2px;
      flex: 1;
      max-width: 58px;
      height: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .key-eng { font-size: 0.6rem; color: var(--text-muted); font-weight: 700; line-height: 1; }
    .key-hin { font-size: 0.95rem; color: #fff; font-weight: 800; line-height: 1.1; margin-top: 1px; }

    /* LANDSCAPE MODE: SIDE-BY-SIDE EQUAL COLUMNS */
    @media screen and (orientation: landscape) {
      #quicktools-global-bar { display: none !important; }
      .keyboard-panel, #keyboardGuide { display: none !important; }
      
      .app-shell {
        padding: 4px 8px !important;
        gap: 4px !important;
      }
      .header-bar {
        padding: 3px 8px !important;
      }
      
      .workspace-area {
        flex-direction: row !important;
        flex: 1 !important;
        gap: 8px !important;
      }
      .passage-card {
        flex: 1 !important;
        height: 100% !important;
        font-size: 1.05rem !important;
        line-height: 1.6 !important;
        padding: 8px 12px !important;
      }
      .input-card {
        flex: 1 !important;
        height: 100% !important;
        padding: 0 !important;
      }
      .typing-input {
        height: 100% !important;
        font-size: 1.05rem !important;
        padding: 10px 12px !important;
      }
    }
  </style>
</head>
<body>

  <!-- GLOBAL NAV BAR -->
  <div id="quicktools-global-bar">
    <div style="display:flex; align-items:center; gap:6px;">
      <a href="https://unknownuniversem-blip.github.io/" style="color:#f8fafc; font-weight:800;">
        <span style="background:#38bdf8; color:#0b1120; font-size:9px; padding:1px 4px; border-radius:3px;">HUB</span> QuickTools
      </a>
    </div>
    <div style="display:flex; align-items:center; gap:10px; overflow-x:auto;">
      <a href="https://unknownuniversem-blip.github.io/hindi-typing-tutor/" style="color:#f59e0b;">⌨️ हिंदी टाइपिंग</a>
      <span>|</span>
      <a href="https://unknownuniversem-blip.github.io/signature-maker-studio/">✍️️ Signature Studio</a>
      <span>|</span>
      <a href="https://unknownuniversem-blip.github.io/krutidev-unicode-converter/">🔤 फॉन्ट कनवर्टर</a>
      <span>|</span>
      <a href="https://unknownuniversem-blip.github.io/exam-resizer/">📷 Photo Resizer</a>
    </div>
  </div>

  <div class="app-shell">
    <!-- TOP STATUS STRIP -->
    <div class="header-bar">
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="brand-title">HindiTyping<span style="color:var(--primary);">Master</span></span>
      </div>

      <div class="toolbar-actions">
        <select id="selLayout" onchange="changeLayout()">
          <option value="mangal" selected>मंगल (Mangal)</option>
          <option value="kruti">कृतिदेव (Kruti)</option>
        </select>
        <select id="selDuration" onchange="resetTest()">
          <option value="60">1 Min</option>
          <option value="180">3 Min</option>
          <option value="300" selected>05:00</option>
        </select>

        <div class="toggle-wrapper active" id="kbToggleBtn" onclick="toggleKeyboardPreference()">
          <span>⌨</span>
          <div class="toggle-switch"></div>
        </div>

        <div class="stat-badge" style="border-color:var(--primary); color:var(--primary);">
          <span>⏱</span><span id="valTime">05:00</span>
        </div>
        <div class="stat-badge" style="border-color:var(--accent); color:var(--accent);">
          <span id="valWpm">0</span><span>WPM</span>
        </div>
        <div class="stat-badge" style="border-color:#38bdf8; color:#38bdf8;">
          <span id="valAcc">100%</span>
        </div>
      </div>
    </div>

    <!-- WORKSPACE AREA: AUTO SIDE-BY-SIDE ON LANDSCAPE -->
    <div class="workspace-area">
      <!-- LEFT BOX: PASSAGE -->
      <div class="passage-card" id="passageDisplay">लोड हो रहा है...</div>

      <!-- RIGHT BOX: INPUT BOX -->
      <div class="input-card">
        <textarea class="typing-input" id="typingInput"
               placeholder="यहाँ टाइप करें (पहला अक्षर टाइप करते ही समय चालू होगा)..."
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               autofocus oninput="handleTyping(event)"></textarea>
      </div>
    </div>

    <!-- ON-SCREEN KEYBOARD (PORTRAIT ONLY) -->
    <div class="keyboard-panel" id="keyboardGuide"></div>
  </div>

  <script>
    const passages = {
      basic: "भारत में बहुत से खेल खेले जाते हैं। लेकिन क्रिकेट मेरा पसंदीदा खेल है। क्रिकेट इंग्लैंड का राष्ट्रीय खेल था। अब यह दुनिया के शीर्ष छह क्रिकेट टीमों में ऑस्ट्रेलिया, भारत, श्रीलंका, न्यूजीलैंड, दक्षिण अफ्रीका, पाकिस्तान और वेस्ट इंडीज हैं।",
      court: "न्यायालय जिला एवं सत्र न्यायाधीश द्वारा आदेश पारित किया जाता है कि वाद संख्या 108 में सभी आवश्यक प्रपत्र तथा साक्ष्य नियत तिथि से पूर्व कार्यालय में प्रस्तुत किए जाएं। किसी भी विलंब की स्थिति में पक्षकार स्वयं उत्तरदायी होंगे।"
    };

    const kbRows = [
      [
        { eng: 'Q', mangal: 'ौ', kruti: 'ु' }, { eng: 'W', mangal: 'ै', kruti: 'ू' }, { eng: 'E', mangal: 'ा', kruti: 'म' },
        { eng: 'R', mangal: 'ी', kruti: 'त' }, { eng: 'T', mangal: 'ू', kruti: 'ज' }, { eng: 'Y', mangal: 'ब', kruti: 'ल' },
        { eng: 'U', mangal: 'ह', kruti: 'न' }, { eng: 'I', mangal: 'ग', kruti: 'प' }, { eng: 'O', mangal: 'द', kruti: 'व' },
        { eng: 'P', mangal: 'ज', kruti: 'च' }
      ],
      [
        { eng: 'A', mangal: 'ो', kruti: 'ं' }, { eng: 'S', mangal: 'े', kruti: 'े' }, { eng: 'D', mangal: '्', kruti: 'क' },
        { eng: 'F', mangal: 'ि', kruti: 'ि' }, { eng: 'G', mangal: 'ु', kruti: 'ह' }, { eng: 'H', mangal: 'प', kruti: 'ी' },
        { eng: 'J', mangal: 'र', kruti: 'र' }, { eng: 'K', mangal: 'क', kruti: 'ा' }, { eng: 'L', mangal: 'त', kruti: 'स' }
      ],
      [
        { eng: 'Z', mangal: 'े', kruti: '्र' }, { eng: 'X', mangal: 'ं', kruti: 'ग' }, { eng: 'C', mangal: 'म', kruti: 'ब' },
        { eng: 'V', mangal: 'न', kruti: 'अ' }, { eng: 'B', mangal: 'व', kruti: 'इ' }, { eng: 'N', mangal: 'ल', kruti: 'द' },
        { eng: 'M', mangal: 'स', kruti: 'उ' }
      ]
    ];

    let currentPassage = "";
    let currentIndex = 0;
    let timerRunning = false;
    let timeRemaining = 300;
    let totalTime = 300;
    let timerInterval = null;
    let errorsCount = 0;
    let totalCharsTyped = 0;
    let showKeyboardPref = true;

    window.addEventListener('DOMContentLoaded', () => {
      renderKeyboard();
      loadPassage();
    });

    function toggleKeyboardPreference() {
      showKeyboardPref = !showKeyboardPref;
      const btn = document.getElementById('kbToggleBtn');
      const panel = document.getElementById('keyboardGuide');
      btn.classList.toggle('active', showKeyboardPref);
      panel.style.display = showKeyboardPref ? 'flex' : 'none';
    }

    function renderKeyboard() {
      const kbContainer = document.getElementById('keyboardGuide');
      const layout = document.getElementById('selLayout').value;
      kbContainer.innerHTML = '';

      kbRows.forEach(row => {
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';
        row.forEach(k => {
          const keyEl = document.createElement('div');
          keyEl.className = 'kb-key';
          keyEl.innerHTML = `<span class="key-eng">${k.eng}</span><span class="key-hin">${layout === 'mangal' ? k.mangal : k.kruti}</span>`;
          rowEl.appendChild(keyEl);
        });
        kbContainer.appendChild(rowEl);
      });
    }

    function changeLayout() { renderKeyboard(); resetTest(); }

    function loadPassage() {
      currentPassage = passages.basic;
      resetTest();
    }

    function renderPassage() {
      const display = document.getElementById('passageDisplay');
      let html = '';
      for (let i = 0; i < currentPassage.length; i++) {
        let ch = currentPassage[i];
        if (i === currentIndex) {
          html += `<span class="char-current" id="activeChar">${ch === ' ' ? '&nbsp;' : ch}</span>`;
        } else if (i < currentIndex) {
          html += `<span class="char-correct">${ch === ' ' ? ' ' : ch}</span>`;
        } else {
          html += `<span>${ch === ' ' ? ' ' : ch}</span>`;
        }
      }
      display.innerHTML = html;
      const activeEl = document.getElementById('activeChar');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function handleTyping(e) {
      if (!timerRunning) startTimer();
      const input = document.getElementById('typingInput');
      const val = input.value;
      if (!val) return;

      const typedChar = val[val.length - 1];
      const expectedChar = currentPassage[currentIndex];
      totalCharsTyped++;

      if (typedChar === expectedChar) {
        currentIndex++;
        input.value = '';
      } else {
        errorsCount++;
      }
      updateScores();
      renderPassage();
    }

    function startTimer() {
      timerRunning = true;
      totalTime = Number(document.getElementById('selDuration').value);
      timeRemaining = totalTime;

      timerInterval = setInterval(() => {
        timeRemaining--;
        const m = Math.floor(timeRemaining / 60);
        const s = timeRemaining % 60;
        document.getElementById('valTime').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('typingInput').disabled = true;
        }
      }, 1000);
    }

    function updateScores() {
      const timeSpentMin = Math.max((totalTime - timeRemaining) / 60, 0.05);
      const netWpm = Math.max(0, Math.round(((totalCharsTyped - errorsCount) / 5) / timeSpentMin));
      const accuracy = totalCharsTyped > 0 ? Math.max(0, Math.round(((totalCharsTyped - errorsCount) / totalCharsTyped) * 100)) : 100;
      document.getElementById('valWpm').innerText = netWpm;
      document.getElementById('valAcc').innerText = `${accuracy}%`;
    }

    function resetTest() {
      clearInterval(timerInterval);
      timerRunning = false;
      currentIndex = 0;
      errorsCount = 0;
      totalCharsTyped = 0;
      totalTime = Number(document.getElementById('selDuration').value);
      timeRemaining = totalTime;

      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      document.getElementById('valTime').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      document.getElementById('valWpm').innerText = '0';
      document.getElementById('valAcc').innerText = '100%';

      const input = document.getElementById('typingInput');
      input.value = '';
      input.disabled = false;
      renderPassage();
    }
  </script>
</body>
</html>
